<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBLOX GENERATOR SCRIPT BY NICO | FULL ENGINE</title>
    <style>
        :root { --neon: #00ff41; --blue: #00d9ff; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-weight: 800; }
        body { margin: 0; background: #000; color: #fff; overflow: hidden; height: 100vh; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }

        .container { 
            width: 92%; max-width: 450px; margin: 15px auto; height: 92vh; 
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            display: flex; flex-direction: column; padding: 20px; position: relative;
        }

        .header h1 { font-size: 22px; text-align: center; color: var(--blue); text-transform: uppercase; margin: 0; }
        .icon-box { flex: 1; display: flex; justify-content: center; align-items: center; }
        .roblox-mirror { 
            width: 60px; height: 60px; background: #fff; position: relative; transform: rotate(-15deg);
            box-shadow: 0 0 30px #fff; animation: spin 4s infinite linear;
        }
        .roblox-mirror::after { content: ''; position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; background: #000; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        select, input { width: 100%; background: #111; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 11px; }
        .btn-outline { background: transparent; border: 1px solid var(--blue); color: var(--blue); }
        .btn-primary { background: var(--blue); color: #000; }
        .btn:disabled { opacity: 0.2; cursor: not-allowed; }

        .modal { position: absolute; bottom: -100%; left: 0; width: 100%; height: 85%; background: #0a0a0a; border-top: 2px solid var(--blue); border-radius: 24px 24px 0 0; padding: 20px; transition: 0.5s; z-index: 100; display: flex; flex-direction: column; }
        .modal.active { bottom: 0; }
        .scroll-list { flex: 1; overflow-y: auto; }
        .list-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item.active { border-color: var(--blue); color: var(--blue); background: rgba(0,217,255,0.05); }

        .review-card { background: rgba(255,255,255,0.02); border: 1px solid var(--blue); padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; }
        #terminal { display: none; height: 100%; flex-direction: column; }
        textarea { flex: 1; background: #000; color: var(--neon); border: 1px dashed var(--neon); border-radius: 12px; padding: 12px; font-size: 10px; outline: none; white-space: pre; resize: none; }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="container">
    <div id="home" class="section">
        <div class="header"><h1>Sarmiento V6</h1></div>
        <label style="font-size:10px; color:var(--blue)">SELECT UI ENGINE:</label>
        <select id="guiChoice">
            <option value="Rayfield">Rayfield UI</option>
            <option value="Orion">Orion UI</option>
            <option value="Venyx">Venyx UI</option>
            <option value="Fluent">Fluent UI</option>
            <option value="NoGUI">No GUI (Raw)</option>
        </select>
        <div class="icon-box"><div class="roblox-mirror"></div></div>
        <button class="btn btn-outline" onclick="openM('mP')">🛡️ PROTECTIONS (<span id="pcnt">0</span>)</button>
        <button id="btnS" class="btn btn-outline" onclick="openM('mS')" disabled>🚀 SCRIPTS (<span id="cnt">0</span>)</button>
        <button id="btnG" class="btn btn-primary" onclick="showReview()" disabled>REVIEW & GENERATE</button>
    </div>

    <div id="loading" style="display:none; flex-direction:column; justify-content:center; align-items:center; height:100%;">
        <div class="roblox-mirror"></div>
        <div id="st" style="margin-top:20px; font-size:12px;">COMPILING...</div>
        <div style="width:80%; height:4px; background:#222; margin-top:10px; border-radius:10px; overflow:hidden;">
            <div id="bar" style="width:0%; height:100%; background:var(--blue);"></div>
        </div>
    </div>

    <div id="terminal" class="section" style="display:none; height:100%; flex-direction:column;">
        <div style="font-size:11px; color:var(--blue); margin-bottom:10px;">✓ SCRIPT SUCCESSFULLY COMPILED</div>
        <textarea id="output" readonly></textarea>
        <button class="btn btn-primary" onclick="location.reload()">BUILD NEW PROJECT</button>
    </div>

    <div id="mP" class="modal">
        <div class="scroll-list" id="pGrid"></div>
        <button class="btn btn-primary" onclick="closeM('mP')">CONFIRM</button>
    </div>
    <div id="mS" class="modal">
        <div class="scroll-list" id="sGrid"></div>
        <button class="btn btn-primary" onclick="closeM('mS')">CONFIRM</button>
    </div>
    <div id="mR" class="modal">
        <div class="scroll-list" id="rGrid"></div>
        <input type="text" id="hubN" value="Sarmiento Hub V6">
        <button class="btn btn-primary" onclick="startGen()">GENERATE LUA</button>
        <button class="btn" style="color:red" onclick="closeM('mR')">BACK</button>
    </div>
</div>

    let selP = [], selS = [];

    function render() {
        const pG = document.getElementById('pGrid'); pG.innerHTML = "";
        document.getElementById('pcnt').innerText = selP.length;
        pData.forEach((p, i) => {
            const d = document.createElement('div'); d.className = 'list-item' + (selP.includes(i) ? ' active' : '');
            d.innerHTML = `<span>${p.n}</span><span>${selP.includes(i)?'✓':'+'}</span>`;
            d.onclick = () => { if(selP.includes(i)) selP=selP.filter(x=>x!==i); else selP.push(i); render(); check(); };
            pG.appendChild(d);
        });

        const sG = document.getElementById('sGrid'); sG.innerHTML = "";
        document.getElementById('cnt').innerText = selS.length;
        sLibrary.forEach((s, i) => {
            const d = document.createElement('div'); d.className = 'list-item' + (selS.includes(i) ? ' active' : '');
            d.innerHTML = `<span>${s.n}</span><span>${selS.includes(i)?'✓':'+'}</span>`;
            d.onclick = () => { if(selS.includes(i)) selS=selS.filter(x=>x!==i); else if(selS.length<5) selS.push(i); render(); check(); };
            sG.appendChild(d);
        });
    }

    function check() {
        document.getElementById('btnS').disabled = selP.length === 0;
        document.getElementById('btnG').disabled = selS.length === 0;
    }

    function showReview() {
        const rG = document.getElementById('rGrid'); rG.innerHTML = "";
        selS.forEach(idx => {
            rG.innerHTML += `<div class="review-card">
                <div style="color:var(--blue); margin-bottom:10px;">${sLibrary[idx].n}</div>
                <select id="t_${idx}">
                    <option value="Button">Button</option>
                    <option value="Toggle">Toggle</option>
                    <option value="Slider">Slider</option>
                    <option value="Input">Textbox (Input)</option>
                </select>
            </div>`;
        });
        openM('mR');
    }

    function startGen() {
        closeM('mR');
        document.getElementById('home').style.display='none';
        document.getElementById('loading').style.display='flex';
        let p = 0;
        let iv = setInterval(() => {
            p += 1.5; document.getElementById('bar').style.width = p + "%";
            if(p >= 100) { clearInterval(iv); build(); }
        }, 100);
    }

    function build() {
        const name = document.getElementById('hubN').value;
        const gui = document.getElementById('guiChoice').value;
        let code = `-- [[ SARMIENTO V6 PRO ]]\n-- [[ HUB NAME: ${name} ]]\n\n`;

        selP.forEach(i => code += pData[i].l + "\n");
        code += "warn('Sarmiento V6: Protections Loaded!')\n\n";

        if(gui === "NoGUI") {
            selS.forEach(i => code += `-- Feature: ${sLibrary[i].n}\n${sLibrary[i].l}\n\n`);
        } else {
            code += `local Lib = loadstring(game:HttpGet('https://sirius.menu/rayfield'))()\n`;
            code += `local Win = Lib:CreateWindow({Name = "${name}", LoadingTitle = "Sarmiento Hub", ConfigurationSaving = {Enabled = false}})\n`;
            code += `local Tab = Win:CreateTab("Main Hacks")\n\n`;
            
            selS.forEach(idx => {
                const type = document.getElementById(`t_${idx}`).value;
                const sName = sLibrary[idx].n;
                const sLogic = sLibrary[idx].l;
                if(type === "Slider") {
                    code += `Tab:CreateSlider({Name = "${sName}", Range = {0, 500}, Increment = 1, Callback = function(V) ${sLogic} end})\n`;
                } else if(type === "Input") {
                    code += `Tab:CreateInput({Name = "${sName}", PlaceholderText = "Value", Callback = function(T) ${sLogic} end})\n`;
                } else {
                    code += `Tab:Create${type}({Name = "${sName}", Callback = function() ${sLogic} end})\n`;
                }
            });
            code += `Lib:Notify({Title = "Sarmiento V6", Content = "Hub Successfully Loaded!", Duration = 5})\n`;
        }

        document.getElementById('output').value = code;
        document.getElementById('loading').style.display='none';
        document.getElementById('terminal').style.display='flex';
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM(id) { document.getElementById(id).classList.remove('active'); }

    const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    setInterval(() => { 
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height); 
        ctx.fillStyle = "#00ff41"; ctx.font = "18px monospace";
        drops.forEach((y, i) => { 
            ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16); 
            if(y*16 > canvas.height && Math.random() > 0.98) drops[i] = 0; drops[i]++; 
        });
    }, 40);
    render();
</script>
